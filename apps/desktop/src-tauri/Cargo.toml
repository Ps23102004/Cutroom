[package]
name = "cutroom-tauri"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "cutroom_tauri"
path = "src/lib.rs"

[[bin]]
name = "cutroom-tauri"
path = "src/main.rs"

[[bin]]
name = "cutroom-cli"
path = "src/bin/cli.rs"

[dependencies]
cutroom-core = { path = "../../../crates/cutroom-core" }
cutroom-jobs = { path = "../../../crates/cutroom-jobs" }
cutroom-media = { path = "../../../crates/cutroom-media" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
