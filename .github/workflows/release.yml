name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-targets: ""
            tauri-args: ""
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
          - platform: macos-latest
            rust-targets: x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin
          - platform: windows-latest
            rust-targets: ""
            tauri-args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm --filter @cutroom/desktop install

      - name: Build frontend
        run: pnpm --filter @cutroom/desktop build

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          args: ${{ matrix.tauri-args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0-dev' }}
          releaseName: "Cutroom ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0-dev' }}"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Local-first AI video production studio with a professional color pipeline
            (4K/120 input, HDR10 output, per-clip grading, .cube LUTs).

            FFmpeg must be installed separately and available on PATH.
